name: Kotlin compatibility maintenance

on:
  workflow_call:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      kotlin:
        description: Exact stable version to retry (blank processes new publications)
        type: string

concurrency:
  # A Release caller already holds the shared queue; avoid waiting on itself.
  group: ${{ github.workflow == 'Release' && format('discovery-{0}', github.run_id) || 'mosaic-compatibility' }}
  cancel-in-progress: false
  queue: max

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: compatibility-writer
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - name: Require main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Certify published artifacts and report failures
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_KOTLIN: ${{ inputs.kotlin }}
        run: |
          export MOSAIC_JAVA_INSTALLATIONS="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
          python3 compatibility/maintain.py scan --kotlin "$REQUESTED_KOTLIN"
      - name: Authenticate the registry writer
        if: ${{ !cancelled() && steps.verify.outputs.evidence == 'true' }}
        id: writer
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.KOTLIN_COMPATIBILITY_APP_ID }}
          private-key: ${{ secrets.KOTLIN_COMPATIBILITY_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Record verified ranges on main and deploy the website
        if: ${{ !cancelled() && steps.writer.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
          GH_WORKFLOW_TOKEN: ${{ github.token }}
        run: python3 compatibility/maintain.py publish --evidence build/reports/compatibility/published.json
