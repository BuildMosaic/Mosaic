name: Kotlin compatibility maintenance

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      kotlin:
        description: Exact stable version to retry (blank discovers new releases)
        type: string

concurrency:
  group: kotlin-compatibility-maintenance
  cancel-in-progress: false

jobs:
  discover:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.discover.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_KOTLIN: ${{ inputs.kotlin }}
        run: |
          if [ -n "$REQUESTED_KOTLIN" ]; then
            python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'compatibility')
          from registry import version
          requested = os.environ['REQUESTED_KOTLIN']
          assert version(requested) >= (2, 2, 0)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('versions=' + json.dumps([requested]) + '\n')
          PY
          else
            python3 compatibility/maintain.py discover
          fi

  investigate:
    needs: discover
    if: needs.discover.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        kotlin: ${{ fromJSON(needs.discover.outputs.versions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Verify compiler and installation
        id: verify
        env:
          KOTLIN_VERSION: ${{ matrix.kotlin }}
        run: python3 compatibility/maintain.py investigate --kotlin "$KOTLIN_VERSION" --java-installations "$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
      - name: Propose the verified mapping
        env:
          GH_TOKEN: ${{ github.token }}
          KOTLIN_VERSION: ${{ matrix.kotlin }}
        run: python3 compatibility/maintain.py propose --kotlin "$KOTLIN_VERSION"
      - name: Report compatibility failure
        if: failure() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          KOTLIN_VERSION: ${{ matrix.kotlin }}
        run: python3 compatibility/maintain.py report-failure --kotlin "$KOTLIN_VERSION"
