name: Kotlin compatibility maintenance

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      kotlin:
        description: Exact stable version to retry (blank discovers new releases)
        type: string

concurrency:
  group: kotlin-compatibility-maintenance
  cancel-in-progress: false

jobs:
  discover:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.discover.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_KOTLIN: ${{ inputs.kotlin }}
        run: |
          if [ -n "$REQUESTED_KOTLIN" ]; then
            python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'compatibility')
          from registry import version
          requested = os.environ['REQUESTED_KOTLIN']
          assert version(requested) >= (2, 2, 0)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('versions=' + json.dumps([requested]) + '\n')
          PY
          else
            python3 compatibility/maintain.py discover
          fi

  investigate:
    needs: discover
    if: needs.discover.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        kotlin: ${{ fromJSON(needs.discover.outputs.versions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Verify compiler and installation
        id: verify
        env:
          KOTLIN_VERSION: ${{ matrix.kotlin }}
        run: python3 compatibility/maintain.py investigate --kotlin "$KOTLIN_VERSION" --java-installations "$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
      - name: Propose the verified mapping
        env:
          GH_TOKEN: ${{ github.token }}
          KOTLIN_VERSION: ${{ matrix.kotlin }}
        run: python3 compatibility/maintain.py propose --kotlin "$KOTLIN_VERSION"
      - name: Hand failure to Codex Cloud
        if: failure() && steps.verify.outcome == 'failure'
        env:
          KOTLIN_VERSION: ${{ matrix.kotlin }}
          CODEX_ENVIRONMENT: ${{ vars.CODEX_COMPATIBILITY_ENVIRONMENT }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          report="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$CODEX_ENVIRONMENT" ] || [ -z "$CODEX_AUTH_JSON" ]; then
            echo '::error::Configure CODEX_COMPATIBILITY_ENVIRONMENT and CODEX_AUTH_JSON to enable the Codex Cloud handoff.'
            exit 1
          fi
          npm install --global @openai/codex@0.162.1
          codex_auth_dir="$HOME/.codex"
          mkdir -p "$codex_auth_dir"
          trap 'rm -f "$codex_auth_dir/auth.json"' EXIT
          (umask 077; printf '%s' "$CODEX_AUTH_JSON" > "$codex_auth_dir/auth.json")
          codex cloud exec --env "$CODEX_ENVIRONMENT" --branch "$GITHUB_REF_NAME" "Fix Kotlin $KOTLIN_VERSION compatibility in $GITHUB_REPOSITORY. Start with the failure logs at $report. Reproduce with python3 compatibility/maintain.py investigate --kotlin $KOTLIN_VERSION. Follow the 18-month Kotlin minor-family support policy; preserve existing verified mappings without automatic age-based removal, exact production admission, and existing analysis semantics. Keep administrative tests minimal; reuse compiler fixtures. Open a PR titled 'Kotlin compatibility: $KOTLIN_VERSION' against $GITHUB_REF_NAME; do not merge or publish a release."
