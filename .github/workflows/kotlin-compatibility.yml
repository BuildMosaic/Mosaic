name: Kotlin compatibility maintenance

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

concurrency:
  group: kotlin-compatibility-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    permissions:
      contents: read
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      versions: ${{ steps.discover.outputs.versions }}
    steps:
      # Schedules load this workflow from main; maintenance code and PRs use develop.
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false
      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 compatibility/maintain.py discover --plan

  investigate:
    needs: discover
    if: ${{ needs.discover.outputs.versions != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Investigate and propose verified mapping or report failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 compatibility/maintain.py discover --java-installations "$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-compatibility
          path: |
            build/reports/compatibility/
            mosaic-gradle-plugin/build/reports/introspector-installation/
            mosaic-gradle-plugin/build/test-results/releaseCompatibilityTest/
          retention-days: 30
