name: Kotlin compatibility maintenance

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      kotlin:
        description: Exact stable version to retry (blank processes new publications)
        type: string

permissions:
  contents: read
concurrency:
  group: mosaic-compatibility
  cancel-in-progress: false
  queue: max

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      tooling: ${{ steps.plan.outputs.tooling }}
      matrix: ${{ steps.plan.outputs.matrix }}
      registry: ${{ steps.plan.outputs.registry }}
      before: ${{ steps.plan.outputs.before }}
      checkpoint: ${{ steps.plan.outputs.checkpoint }}
      beforeCheckpoint: ${{ steps.plan.outputs.beforeCheckpoint }}
    steps:
      - name: Require main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Discover stable Kotlin publications and affected releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          KOTLIN: ${{ inputs.kotlin }}
        run: python3 compatibility/automation.py plan --kotlin "$KOTLIN"

  compatibility:
    name: Check ${{ matrix.runtime }} / ${{ matrix.analysis }} / ${{ matrix.kotlin }}
    if: needs.discover.outputs.matrix != '[]'
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.tooling }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Check the published combination
        env:
          RUNTIME: ${{ matrix.runtime }}
          ANALYSIS: ${{ matrix.analysis }}
          KOTLIN: ${{ matrix.kotlin }}
        run: ./compatibility/check.sh "$RUNTIME" "$ANALYSIS" "$KOTLIN"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: consumer-${{ strategy.job-index }}
          path: build/compatibility/
          retention-days: 7

  report:
    if: ${{ !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.pending == 'true' }}
    needs: [discover, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      registry: ${{ steps.results.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.tooling }}
          persist-credentials: false
      - name: Report failures or accept the passing batch
        id: results
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.discover.outputs.matrix }}
          REGISTRY: ${{ needs.discover.outputs.registry }}
          BEFORE: ${{ needs.discover.outputs.before }}
        run: python3 compatibility/automation.py results --maintenance

  record:
    needs: [discover, report]
    runs-on: ubuntu-latest
    environment: compatibility-writer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.tooling }}
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: writer
        with:
          app-id: ${{ vars.KOTLIN_COMPATIBILITY_APP_ID }}
          private-key: ${{ secrets.KOTLIN_COMPATIBILITY_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Atomically record ranges and publication checkpoint
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
          REGISTRY: ${{ needs.report.outputs.registry }}
          BEFORE: ${{ needs.discover.outputs.before }}
          CHECKPOINT: ${{ needs.discover.outputs.checkpoint }}
          BEFORE_CHECKPOINT: ${{ needs.discover.outputs.beforeCheckpoint }}
        run: python3 compatibility/automation.py record
