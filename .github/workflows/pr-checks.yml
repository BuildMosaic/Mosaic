name: PR Validation

on:
  pull_request:
    branches: [ main, develop, feature/tracing-rebuild, 'release/*' ]

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check PR diff whitespace
      id: whitespace
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: zulu
        cache: gradle

    - name: Run comprehensive PR validation
      run: ./gradlew check --no-daemon

    - name: Verify benchmark harness
      run: python3 -m unittest discover -s performance/benchmark/tests -v

    - name: Verify examples
      run: ./gradlew check --no-daemon -p examples

    - name: Generate XML coverage report (for debugging)
      if: failure() && steps.whitespace.outcome == 'success'
      run: ./gradlew koverXmlReport --no-daemon

    - name: Verify build artifacts
      if: failure()
      run: |
        echo "Verifying build artifacts..."
        find . -path "**/build/reports/*" -type d | grep -E "(detekt|kover|ktlint|tests)" | wc -l
        echo "Build verification complete"

    - name: Upload build reports (only on failure)
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-reports
        path: |
          **/build/reports/
        retention-days: 7
