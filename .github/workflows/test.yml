name: Test Badge

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17 for Maven consumers
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: zulu

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: zulu
        cache: gradle

    - name: Run tests
      run: ./gradlew test --no-daemon -Porg.gradle.java.installations.paths="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"

    - name: Verify examples
      run: ./gradlew test --no-daemon -p examples
