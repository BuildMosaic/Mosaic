name: Release

on:
  workflow_dispatch:
    inputs:
      train:
        description: Release train
        required: true
        type: choice
        options:
          - runtime
          - analysis
      counterparts:
        description: Published versions of the other train to check (comma-separated; blank uses latest recorded)
        required: false
        type: string
      version:
        description: Version to release
        required: true
        type: string

concurrency:
  group: mosaic-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require dispatch from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/main

      - uses: actions/checkout@v4

      - name: Fetch and validate the immutable tag
        id: release
        env:
          RELEASE_TRAIN: ${{ inputs.train }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          case "$RELEASE_TRAIN" in runtime|analysis) ;; *) exit 1 ;; esac
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          RELEASE_TAG="${RELEASE_TRAIN}-${RELEASE_VERSION}"
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          git checkout --detach 'FETCH_HEAD^{commit}'
          sha="$(git rev-parse HEAD)"
          entry="$(grep -F "## [$RELEASE_TAG] - " CHANGELOG.md)"
          [[ "$entry" =~ ^##\ \[$RELEASE_TAG\]\ -\ [0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          entry_date="${entry##* - }"
          test "$(date -d "$entry_date" +%F)" = "$entry_date"
          test -s "docs/releases/$RELEASE_TAG.md"
          test -z "$(git status --porcelain)"
          echo "Validated $RELEASE_TAG at $sha"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17 for compatibility consumers
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Check repository
        run: ./gradlew check

      - name: Check examples
        run: ./gradlew check -p examples

      - name: Certify release compatibility
        env:
          RELEASE_TRAIN: ${{ inputs.train }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          COUNTERPARTS: ${{ inputs.counterparts }}
        run: |
          args=()
          if [ -n "$COUNTERPARTS" ]; then args+=("-Pcompat.counterparts=$COUNTERPARTS"); fi
          ./gradlew certifyReleaseCompatibility -Pcompat.scope="$RELEASE_TRAIN" -Pcompat.release="$RELEASE_VERSION" "${args[@]}" --no-configuration-cache -Porg.gradle.java.installations.paths="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
          cat "build/reports/compatibility/release-$RELEASE_TRAIN.json"

      - name: Publish Runtime
        if: ${{ success() && inputs.train == 'runtime' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew releaseRuntime -Pmosaic.runtime.version="$RELEASE_VERSION" --no-configuration-cache

      - name: Publish Analysis
        if: ${{ success() && inputs.train == 'analysis' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew releaseAnalysis -Pmosaic.analysis.version="$RELEASE_VERSION" --no-configuration-cache

      - name: Create GitHub Release from checked-in release notes and changelog
        env:
          RELEASE_TRAIN: ${{ inputs.train }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          entry="$(grep -F "## [$RELEASE_TAG] - " CHANGELOG.md)"
          notes="$(mktemp "${RUNNER_TEMP}/mosaic-release-notes.XXXXXXXX")"
          trap 'rm -f -- "$notes"' EXIT
          sed "s#](../../#](https://github.com/BuildMosaic/Mosaic/blob/$RELEASE_TAG/#g" "docs/releases/$RELEASE_TAG.md" > "$notes"
          printf '\n' >> "$notes"
          awk -v heading="$entry" -v tag="$RELEASE_TAG" '
            $0 == heading {copy=1}
            copy && $0 != heading && /^## / {exit}
            copy {gsub(/\]\(mosaic-gradle-plugin\/README.md/, "](https://github.com/BuildMosaic/Mosaic/blob/" tag "/mosaic-gradle-plugin/README.md"); print}
          ' CHANGELOG.md >> "$notes"
          if existing_release="$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>&1)"; then
            echo "::error::A GitHub Release already exists for $RELEASE_TAG: $existing_release"
            exit 1
          elif [[ "$existing_release" == 'release not found' ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Mosaic $RELEASE_TRAIN $RELEASE_VERSION" --notes-file "$notes"
          else
            echo "::error::Could not inspect GitHub Release for $RELEASE_TAG: $existing_release"
            exit 1
          fi

      # Default success() gates this on publication AND GitHub Release creation.
      - name: Propose the certified published compatibility registry
        if: success() && !contains(steps.release.outputs.version, '-')
        env:
          RELEASE_TRAIN: ${{ inputs.train }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence="$GITHUB_WORKSPACE/build/reports/compatibility/release-$RELEASE_TRAIN.json"
          git fetch --no-tags origin main
          git checkout --detach FETCH_HEAD
          python3 compatibility/maintain.py record --evidence "$evidence" --train "$RELEASE_TRAIN" --version "$RELEASE_VERSION" --revision "$RELEASE_SHA"
