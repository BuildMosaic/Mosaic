name: Release

on:
  workflow_dispatch:
    inputs:
      train:
        description: Release train
        required: true
        type: choice
        options:
          - runtime
          - analysis
      minKotlin:
        description: Intended Kotlin minimum (blank inherits previous release)
        type: string
      maxKotlin:
        description: Intended Kotlin maximum (blank uses latest stable publication)
        type: string
      minRuntime:
        description: Analysis Runtime minimum (blank inherits previous Analysis)
        type: string
      maxRuntime:
        description: Analysis Runtime maximum (blank uses latest Runtime)
        type: string
      version:
        description: Version to release
        required: true
        type: string

concurrency:
  group: mosaic-compatibility
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Prepare release certification
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: compatibility-writer
    permissions:
      contents: read
      actions: write
      issues: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      attempt: ${{ steps.release.outputs.attempt }}
    steps:
      - name: Require dispatch from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/main

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17 for compatibility consumers
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      # Run the same discovery and event processing path while holding the shared slot.
      - name: Process outstanding Kotlin publications
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 compatibility/maintain.py scan --java-installations "$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"

      - name: Authenticate the maintenance registry writer
        if: ${{ !cancelled() && steps.discover.outputs.evidence == 'true' }}
        id: maintenance-writer
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.KOTLIN_COMPATIBILITY_APP_ID }}
          private-key: ${{ secrets.KOTLIN_COMPATIBILITY_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Record processed Kotlin publications
        if: ${{ !cancelled() && steps.maintenance-writer.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.maintenance-writer.outputs.token }}
          GH_WORKFLOW_TOKEN: ${{ github.token }}
        run: python3 compatibility/maintain.py publish --evidence build/reports/compatibility/published.json

      - name: Keep current compatibility tooling and read latest policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -R compatibility "$RUNNER_TEMP/mosaic-compatibility"
          python3 "$RUNNER_TEMP/mosaic-compatibility/maintain.py" refresh

      - name: Fetch and validate the immutable tag
        id: release
        env:
          RELEASE_TRAIN: ${{ inputs.train }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          case "$RELEASE_TRAIN" in runtime|analysis) ;; *) exit 1 ;; esac
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          RELEASE_TAG="${RELEASE_TRAIN}-${RELEASE_VERSION}"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::Release tag $RELEASE_TAG must point to a commit reachable from protected main"
            exit 1
          fi
          git checkout --detach "$sha"
          entry="$(grep -F "## [$RELEASE_TAG] - " CHANGELOG.md)"
          [[ "$entry" =~ ^##\ \[$RELEASE_TAG\]\ -\ [0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          entry_date="${entry##* - }"
          test "$(date -d "$entry_date" +%F)" = "$entry_date"
          test -s "docs/releases/$RELEASE_TAG.md"
          test -z "$(git status --porcelain)"
          echo "Validated $RELEASE_TAG at $sha"
          {
            echo "version=$RELEASE_VERSION"
            echo "tag=$RELEASE_TAG"
            echo "sha=$sha"
            echo "attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Check repository
        run: ./gradlew check

      - name: Check examples
        run: ./gradlew check -p examples

      - name: Prepare immutable certification inputs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TRAIN: ${{ inputs.train }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          MIN_KOTLIN: ${{ inputs.minKotlin }}
          MAX_KOTLIN: ${{ inputs.maxKotlin }}
          MIN_RUNTIME: ${{ inputs.minRuntime }}
          MAX_RUNTIME: ${{ inputs.maxRuntime }}
          MOSAIC_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          python3 "$RUNNER_TEMP/mosaic-compatibility/release.py" prepare --directory "$GITHUB_WORKSPACE/build/reports/compatibility/prepared" --scope "$RELEASE_TRAIN" --release "$RELEASE_VERSION" \
            --minKotlin "$MIN_KOTLIN" --maxKotlin "$MAX_KOTLIN" --minRuntime "$MIN_RUNTIME" --maxRuntime "$MAX_RUNTIME" \
            --java-installations "$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
          mkdir -p build/reports/compatibility/tooling
          cp -R "$RUNNER_TEMP/mosaic-compatibility/." build/reports/compatibility/tooling/
          tar -cf "$RUNNER_TEMP/inputs.tar" build/reports/compatibility/prepared build/reports/compatibility/tooling

      - uses: actions/upload-artifact@v4
        with:
          name: release-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs.tar
          if-no-files-found: error
          retention-days: 7
      - name: Upload preparation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-prepare-logs-${{ github.run_attempt }}
          path: build/reports/compatibility/**/*.log
          retention-days: 7

  kotlin:
    name: Certify Kotlin ${{ matrix.kotlin }}
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        kotlin: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs-${{ needs.prepare.outputs.attempt }}
          path: ${{ runner.temp }}/release-inputs
      - name: Restore immutable certification inputs
        run: tar -xf "$RUNNER_TEMP/release-inputs/inputs.tar" -C "$GITHUB_WORKSPACE"
      - name: Certify this Kotlin version
        env:
          KOTLIN: ${{ matrix.kotlin }}
          MOSAIC_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          python3 build/reports/compatibility/tooling/release.py worker \
            --directory build/reports/compatibility/prepared --kotlin "$KOTLIN" \
            --evidence build/reports/compatibility/evidence \
            --java-installations "$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
      - name: Upload Kotlin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ matrix.kotlin }}-${{ needs.prepare.outputs.attempt }}
          overwrite: true
          path: build/reports/compatibility/evidence/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload Kotlin diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-kotlin-logs-${{ matrix.kotlin }}-${{ github.run_attempt }}
          path: |
            build/reports/compatibility/**/*.log
            build/reports/compatibility/**/junit/
            mosaic-gradle-plugin/build/reports/introspector-installation/
          retention-days: 7

  aggregate:
    name: Verify complete release certification
    needs: [prepare, kotlin]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs-${{ needs.prepare.outputs.attempt }}
          path: ${{ runner.temp }}/release-inputs
      - name: Restore immutable certification inputs
        run: tar -xf "$RUNNER_TEMP/release-inputs/inputs.tar" -C "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.matrix != '[]'
        with:
          pattern: release-evidence-*-${{ needs.prepare.outputs.attempt }}
          path: build/reports/compatibility/evidence
          merge-multiple: true
      - name: Compare summaries and verify cross-compiler behavior
        env:
          MOSAIC_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p build/reports/compatibility/evidence
          python3 build/reports/compatibility/tooling/release.py aggregate \
            --directory build/reports/compatibility/prepared --evidence build/reports/compatibility/evidence \
            --java-installations "$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
      - name: Show authoritative certification result
        env:
          RELEASE_TRAIN: ${{ inputs.train }}
        run: cat "build/reports/compatibility/release-$RELEASE_TRAIN.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-certification-${{ needs.prepare.outputs.attempt }}
          overwrite: true
          path: build/reports/compatibility/release-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload aggregation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-aggregate-logs-${{ github.run_attempt }}
          path: |
            build/reports/compatibility/**/*.log
            build/reports/compatibility/**/junit/
            mosaic-gradle-plugin/build/reports/introspector-installation/
          retention-days: 7

  release:
    name: Publish release
    needs: [prepare, kotlin, aggregate]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.aggregate.result == 'success' && (needs.kotlin.result == 'success' || needs.kotlin.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Only publication requires release approval; workers have no environment or write token.
    environment: release
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs-${{ needs.prepare.outputs.attempt }}
          path: ${{ runner.temp }}/release-inputs
      - name: Restore immutable certification inputs
        run: tar -xf "$RUNNER_TEMP/release-inputs/inputs.tar" -C "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: release-certification-${{ needs.prepare.outputs.attempt }}
          path: build/reports/compatibility
      - name: Revalidate immutable tag before publication
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TRAIN: ${{ inputs.train }}
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          result = json.loads(Path(f"build/reports/compatibility/release-{os.environ['RELEASE_TRAIN']}.json").read_text())
          assert (result['train'], result['version'], result['revision'], result['result']) == (
              os.environ['RELEASE_TRAIN'], os.environ['RELEASE_VERSION'], os.environ['RELEASE_SHA'], 'pass')
          PYTHON

      - name: Publish Runtime
        if: ${{ success() && inputs.train == 'runtime' }}
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew releaseRuntime -Pmosaic.runtime.version="$RELEASE_VERSION" --no-configuration-cache

      - name: Publish Analysis
        if: ${{ success() && inputs.train == 'analysis' }}
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew releaseAnalysis -Pmosaic.analysis.version="$RELEASE_VERSION" --no-configuration-cache

      - name: Create GitHub Release from checked-in release notes and changelog
        env:
          RELEASE_TRAIN: ${{ inputs.train }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          entry="$(grep -F "## [$RELEASE_TAG] - " CHANGELOG.md)"
          notes="$(mktemp "${RUNNER_TEMP}/mosaic-release-notes.XXXXXXXX")"
          trap 'rm -f -- "$notes"' EXIT
          sed "s#](../../#](https://github.com/BuildMosaic/Mosaic/blob/$RELEASE_TAG/#g" "docs/releases/$RELEASE_TAG.md" > "$notes"
          printf '\n' >> "$notes"
          awk -v heading="$entry" -v tag="$RELEASE_TAG" '
            $0 == heading {copy=1}
            copy && $0 != heading && /^## / {exit}
            copy {gsub(/\]\(mosaic-gradle-plugin\/README.md/, "](https://github.com/BuildMosaic/Mosaic/blob/" tag "/mosaic-gradle-plugin/README.md"); print}
          ' CHANGELOG.md >> "$notes"
          if existing_release="$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>&1)"; then
            echo "::error::A GitHub Release already exists for $RELEASE_TAG: $existing_release"
            exit 1
          elif [[ "$existing_release" == 'release not found' ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Mosaic $RELEASE_TRAIN $RELEASE_VERSION" --notes-file "$notes"
          else
            echo "::error::Could not inspect GitHub Release for $RELEASE_TAG: $existing_release"
            exit 1
          fi

      - name: Authenticate the registry writer
        if: success() && !contains(needs.prepare.outputs.version, '-')
        id: writer
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.KOTLIN_COMPATIBILITY_APP_ID }}
          private-key: ${{ secrets.KOTLIN_COMPATIBILITY_APP_PRIVATE_KEY }}
          permission-contents: write

      # Publication and GitHub Release creation must both succeed.
      - name: Record published compatibility on main and deploy the website
        if: success() && !contains(needs.prepare.outputs.version, '-')
        env:
          RELEASE_TRAIN: ${{ inputs.train }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          MOSAIC_SOURCE_ROOT: ${{ github.workspace }}
          GH_TOKEN: ${{ steps.writer.outputs.token }}
          GH_WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          evidence="$GITHUB_WORKSPACE/build/reports/compatibility/release-$RELEASE_TRAIN.json"
          python3 "$GITHUB_WORKSPACE/build/reports/compatibility/tooling/maintain.py" record --evidence "$evidence" --train "$RELEASE_TRAIN" --version "$RELEASE_VERSION" --revision "$RELEASE_SHA"
