name: Release

on:
  workflow_dispatch:
    inputs:
      train:
        description: Release train
        required: true
        type: choice
        options: [runtime, analysis]
      version:
        description: Version to release
        required: true
        type: string
      minKotlin:
        description: Intended Kotlin minimum (blank inherits previous release)
        type: string
      maxKotlin:
        description: Intended Kotlin maximum (blank uses latest stable publication)
        type: string
      minRuntime:
        description: Analysis Runtime minimum (blank inherits previous Analysis)
        type: string
      maxRuntime:
        description: Analysis Runtime maximum (blank uses latest Runtime)
        type: string

permissions:
  contents: read
concurrency:
  group: mosaic-compatibility
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      tagObject: ${{ steps.plan.outputs.tagObject }}
      tooling: ${{ steps.plan.outputs.tooling }}
      matrix: ${{ steps.plan.outputs.matrix }}
      registry: ${{ steps.plan.outputs.registry }}
      before: ${{ steps.plan.outputs.before }}
      checkpoint: ${{ steps.plan.outputs.checkpoint }}
    steps:
      - name: Require dispatch from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and plan compatibility
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN: ${{ inputs.train }}
          VERSION: ${{ inputs.version }}
          MIN_KOTLIN: ${{ inputs.minKotlin }}
          MAX_KOTLIN: ${{ inputs.maxKotlin }}
          MIN_RUNTIME: ${{ inputs.minRuntime }}
          MAX_RUNTIME: ${{ inputs.maxRuntime }}
        run: |
          python3 compatibility/automation.py plan --train "$TRAIN" --version "$VERSION" \
            --minKotlin "$MIN_KOTLIN" --maxKotlin "$MAX_KOTLIN" --minRuntime "$MIN_RUNTIME" --maxRuntime "$MAX_RUNTIME"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Run product and example checks
        working-directory: candidate
        run: |
          ./gradlew check -Porg.gradle.java.installations.paths="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
          ./gradlew check -p examples

  compatibility:
    name: Check ${{ matrix.runtime }} / ${{ matrix.analysis }} / ${{ matrix.kotlin }}
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tooling }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Prepare candidate artifacts locally
        working-directory: candidate
        env:
          TRAIN: ${{ inputs.train }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$TRAIN" == runtime ]]; then
            modules=(mosaic-core mosaic-test mosaic-opentelemetry mosaic-bom)
          else
            modules=(mosaic-compiler-plugin mosaic-gradle-plugin)
          fi
          tasks=()
          for module in "${modules[@]}"; do tasks+=(":$module:publishAllPublicationsToInstallTestRepository"); done
          ./gradlew "${tasks[@]}" "-Pmosaic.$TRAIN.version=$VERSION" \
            -Pmosaic.installTestRepository="$RUNNER_TEMP/maven" --no-configuration-cache --no-configure-on-demand
      - name: Check the exact combination
        env:
          RUNTIME: ${{ matrix.runtime }}
          ANALYSIS: ${{ matrix.analysis }}
          KOTLIN: ${{ matrix.kotlin }}
          MOSAIC_COMPAT_REPOSITORY: ${{ runner.temp }}/maven
        run: ./compatibility/check.sh "$RUNTIME" "$ANALYSIS" "$KOTLIN"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: consumer-${{ strategy.job-index }}
          path: build/compatibility/
          retention-days: 7

  complete:
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    needs: [prepare, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      registry: ${{ steps.results.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tooling }}
          persist-credentials: false
      - name: Require passing jobs and retain failed optional bounds
        id: results
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          BEFORE: ${{ needs.prepare.outputs.before }}
        run: python3 compatibility/automation.py results

  publish:
    needs: [prepare, complete]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tooling }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck tag and unpublished coordinates
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN: ${{ inputs.train }}
          VERSION: ${{ inputs.version }}
          TAG_OBJECT: ${{ needs.prepare.outputs.tagObject }}
        run: python3 compatibility/automation.py tag --train "$TRAIN" --version "$VERSION" --expected-object "$TAG_OBJECT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Publish Runtime
        if: inputs.train == 'runtime'
        working-directory: candidate
        env:
          VERSION: ${{ inputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew releaseRuntime -Pmosaic.runtime.version="$VERSION" --no-configuration-cache
      - name: Publish Analysis
        if: inputs.train == 'analysis'
        working-directory: candidate
        env:
          VERSION: ${{ inputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew releaseAnalysis -Pmosaic.analysis.version="$VERSION" --no-configuration-cache
      - name: Create GitHub Release
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN: ${{ inputs.train }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="$TRAIN-$VERSION"
          notes="$RUNNER_TEMP/release-notes.md"
          sed "s#](../../#](https://github.com/BuildMosaic/Mosaic/blob/$tag/#g" "docs/releases/$tag.md" > "$notes"
          printf '\n' >> "$notes"
          awk -v heading="## [$tag] - " '
            index($0, heading) == 1 {copy=1; print; next}
            copy && /^## / {exit}
            copy {print}
          ' CHANGELOG.md >> "$notes"
          gh release create "$tag" --verify-tag --title "Mosaic $TRAIN $VERSION" --notes-file "$notes"

  record:
    if: ${{ !contains(inputs.version, '-') }}
    needs: [prepare, complete, publish]
    runs-on: ubuntu-latest
    environment: compatibility-writer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tooling }}
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: writer
        with:
          app-id: ${{ vars.KOTLIN_COMPATIBILITY_APP_ID }}
          private-key: ${{ secrets.KOTLIN_COMPATIBILITY_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Record published compatibility
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
          REGISTRY: ${{ needs.complete.outputs.registry }}
          BEFORE: ${{ needs.prepare.outputs.before }}
          CHECKPOINT: ${{ needs.prepare.outputs.checkpoint }}
          BEFORE_CHECKPOINT: ${{ needs.prepare.outputs.checkpoint }}
        run: python3 compatibility/automation.py record

  recording-status:
    if: ${{ always() && needs.publish.result == 'success' && !contains(inputs.version, '-') && needs.record.result != 'success' }}
    needs: [publish, record]
    runs-on: ubuntu-latest
    steps:
      - name: Report published release awaiting certification recording
        run: |
          echo '::error::Publication succeeded but registry/documentation recording did not. Recover recording using .github/MAINTAINING.md; do not rerun artifact publication.'
          echo 'Publication succeeded. Registry/documentation recording requires recovery; do not retry publication. See .github/MAINTAINING.md.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
