name: Release

on:
  workflow_dispatch:
    inputs:
      train:
        description: Release train
        required: true
        type: choice
        options:
          - runtime
          - analysis
      minKotlin:
        description: Intended Kotlin minimum (blank inherits previous release)
        type: string
      maxKotlin:
        description: Intended Kotlin maximum (blank uses latest stable publication)
        type: string
      minRuntime:
        description: Analysis Runtime minimum (blank inherits previous Analysis)
        type: string
      maxRuntime:
        description: Analysis Runtime maximum (blank uses latest Runtime)
        type: string
      version:
        description: Version to release
        required: true
        type: string

concurrency:
  group: mosaic-compatibility
  cancel-in-progress: false
  queue: max

jobs:
  discover:
    uses: ./.github/workflows/kotlin-compatibility.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write
      actions: write

  prepare:
    name: Prepare release
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      tag_object: ${{ steps.release.outputs.tag_object }}
      tooling: ${{ steps.release.outputs.tooling }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Require dispatch from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Validate immutable signed tag on protected main
        id: release
        env:
          RELEASE_TRAIN: ${{ inputs.train }}
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_TRAIN" in runtime|analysis) ;; *) exit 1 ;; esac
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          tag="${RELEASE_TRAIN}-${RELEASE_VERSION}"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "refs/tags/$tag:refs/tags/$tag"
          sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(git rev-parse "refs/tags/$tag")" --jq '.verification.verified')" = true
          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "tag_object=$(git rev-parse "refs/tags/$tag")"
            echo "tooling=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Check release commit and examples
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          cd candidate
          entry="$(grep -F "## [$RELEASE_TAG] - " CHANGELOG.md)"
          [[ "$entry" =~ ^##\ \[$RELEASE_TAG\]\ -\ [0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          entry_date="${entry##* - }"
          test "$(date -d "$entry_date" +%F)" = "$entry_date"
          test -s "docs/releases/$RELEASE_TAG.md"
          ./gradlew check
          ./gradlew check -p examples
      - name: Plan exact compatibility intersections
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TRAIN: ${{ inputs.train }}
          VERSION: ${{ inputs.version }}
          MIN_KOTLIN: ${{ inputs.minKotlin }}
          MAX_KOTLIN: ${{ inputs.maxKotlin }}
          MIN_RUNTIME: ${{ inputs.minRuntime }}
          MAX_RUNTIME: ${{ inputs.maxRuntime }}
        run: |
          python3 compatibility/maintain.py refresh
          python3 compatibility/release.py plan --train "$TRAIN" --version "$VERSION" \
            --minKotlin "$MIN_KOTLIN" --maxKotlin "$MAX_KOTLIN" --minRuntime "$MIN_RUNTIME" --maxRuntime "$MAX_RUNTIME"
      - name: Install candidate Maven artifacts
        env:
          TRAIN: ${{ inputs.train }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$TRAIN" == runtime ]]; then
            modules=(mosaic-core mosaic-test mosaic-opentelemetry mosaic-bom)
          else
            modules=(mosaic-compiler-plugin mosaic-gradle-plugin)
          fi
          tasks=("${modules[@]/#/:}")
          tasks=("${tasks[@]/%/:publishAllPublicationsToInstallTestRepository}")
          candidate/gradlew -p candidate "${tasks[@]}" "-Pmosaic.$TRAIN.version=$VERSION" \
            "-Pmosaic.installTestRepository=$GITHUB_WORKSPACE/build/compatibility-repository" --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: release-plan
          path: |
            release-plan.json
            compatibility/registry.json
            compatibility/kotlin-checkpoint.txt
            build/compatibility-repository
          if-no-files-found: error

  certify:
    name: Kotlin ${{ matrix.kotlin }}
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tooling }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - name: Check exact Runtime and Analysis combinations
        env:
          KOTLIN: ${{ matrix.kotlin }}
          CHECKS: ${{ toJSON(matrix.checks) }}
        run: |
          export MOSAIC_JAVA_INSTALLATIONS="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
          mkdir -p build/reports/compatibility/optional-failures
          while IFS=$'\t' read -r runtime analysis optional; do
            if ! compatibility/check.sh "$runtime" "$analysis" "$KOTLIN"; then
              if [[ "$optional" != true ]]; then exit 1; fi
              touch "build/reports/compatibility/optional-failures/$analysis"
              echo "::warning::Optional Analysis $analysis extension failed on Kotlin $KOTLIN; retaining its Runtime bound"
            fi
          done < <(jq -r '.[] | [.runtime, .analysis, .optional] | @tsv' <<< "$CHECKS")
          echo "Kotlin $KOTLIN checks completed" > "build/reports/compatibility/kotlin-$KOTLIN.txt"
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: certification-${{ matrix.kotlin }}
          path: build/reports/compatibility
          if-no-files-found: error
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: test-logs-${{ matrix.kotlin }}
          path: |
            compatibility/build/reports
            compatibility/build/test-results
            mosaic-gradle-plugin/build/reports/introspector-installation

  verify:
    name: Cross-version verification
    needs: [prepare, certify]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.certify.result == 'success' || needs.prepare.outputs.matrix == '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tooling }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: certification-*
          path: certification
          merge-multiple: true
      - name: Compare summaries and check compiler switching and caches
        run: |
          export MOSAIC_JAVA_INSTALLATIONS="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
          export MOSAIC_COMPAT_REPOSITORY="$GITHUB_WORKSPACE/build/compatibility-repository"
          python3 compatibility/release.py finish
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          overwrite: true
          name: cross-version-failure
          path: mosaic-gradle-plugin/build/reports
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: release-result
          path: release-result.json
          if-no-files-found: error

  release:
    name: Approve and publish release
    needs: [prepare, verify]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tooling }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          name: release-result
      - name: Revalidate tag before publication
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          TAG_OBJECT: ${{ needs.prepare.outputs.tag_object }}
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG")" = "$TAG_OBJECT"
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
      - name: Publish selected train
        env:
          RELEASE_TRAIN: ${{ inputs.train }}
          RELEASE_VERSION: ${{ inputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          if [[ "$RELEASE_TRAIN" == runtime ]]; then task=releaseRuntime; else task=releaseAnalysis; fi
          ./gradlew "$task" "-Pmosaic.$RELEASE_TRAIN.version=$RELEASE_VERSION" --no-configuration-cache

      - name: Create GitHub Release from checked-in release notes and changelog
        env:
          RELEASE_TRAIN: ${{ inputs.train }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          entry="$(grep -F "## [$RELEASE_TAG] - " CHANGELOG.md)"
          notes="$(mktemp "${RUNNER_TEMP}/mosaic-release-notes.XXXXXXXX")"
          trap 'rm -f -- "$notes"' EXIT
          sed "s#](../../#](https://github.com/BuildMosaic/Mosaic/blob/$RELEASE_TAG/#g" "docs/releases/$RELEASE_TAG.md" > "$notes"
          printf '\n' >> "$notes"
          awk -v heading="$entry" -v tag="$RELEASE_TAG" '
            $0 == heading {copy=1}
            copy && $0 != heading && /^## / {exit}
            copy {gsub(/\]\(mosaic-gradle-plugin\/README.md/, "](https://github.com/BuildMosaic/Mosaic/blob/" tag "/mosaic-gradle-plugin/README.md"); print}
          ' CHANGELOG.md >> "$notes"
          if existing_release="$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>&1)"; then
            echo "::error::A GitHub Release already exists for $RELEASE_TAG: $existing_release"
            exit 1
          elif [[ "$existing_release" == 'release not found' ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Mosaic $RELEASE_TRAIN $RELEASE_VERSION" --notes-file "$notes"
          else
            echo "::error::Could not inspect GitHub Release for $RELEASE_TAG: $existing_release"
            exit 1
          fi

      - name: Authenticate the registry writer
        if: success() && !contains(inputs.version, '-')
        id: writer
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.KOTLIN_COMPATIBILITY_APP_ID }}
          private-key: ${{ secrets.KOTLIN_COMPATIBILITY_APP_PRIVATE_KEY }}
          permission-contents: write

      # Publication and GitHub Release creation must both succeed.
      - name: Record published compatibility on main and deploy the website
        if: success() && !contains(inputs.version, '-')
        env:
          RELEASE_TRAIN: ${{ inputs.train }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          GH_TOKEN: ${{ steps.writer.outputs.token }}
          GH_WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          python3 tooling/compatibility/maintain.py record --evidence release-result.json --train "$RELEASE_TRAIN" --version "$RELEASE_VERSION" --revision "$RELEASE_SHA"
