name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag, for example 0.7.0
        required: true
        type: string

concurrency:
  group: mosaic-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release
    permissions:
      contents: write
    steps:
      - name: Require dispatch from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/main

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Fetch and validate the immutable tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          git checkout --detach 'FETCH_HEAD^{commit}'
          sha="$(git rev-parse HEAD)"
          test "$(sed -n 's/^mosaic.version=//p' gradle.properties)" = "$RELEASE_TAG"
          entry="$(grep -F "## [$RELEASE_TAG] - " CHANGELOG.md)"
          [[ "$entry" =~ ^##\ \[$RELEASE_TAG\]\ -\ [0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          entry_date="${entry##* - }"
          test "$(date -d "$entry_date" +%F)" = "$entry_date"
          test -z "$(git status --porcelain)"
          echo "Validated $RELEASE_TAG at $sha"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Check repository
        run: ./gradlew check

      - name: Check examples
        run: ./gradlew check -p examples

      - name: Publish release
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew release --no-configuration-cache

      - name: Create GitHub Release from checked-in release notes and changelog
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          entry="$(grep -F "## [$RELEASE_TAG] - " CHANGELOG.md)"
          notes="$(mktemp "${RUNNER_TEMP}/mosaic-release-notes.XXXXXXXX")"
          trap 'rm -f -- "$notes"' EXIT
          sed "s#](../../#](https://github.com/BuildMosaic/Mosaic/blob/$RELEASE_TAG/#g" "docs/releases/$RELEASE_TAG.md" > "$notes"
          printf '\n' >> "$notes"
          awk -v heading="$entry" -v tag="$RELEASE_TAG" '
            $0 == heading {copy=1}
            copy && $0 != heading && /^## / {exit}
            copy {gsub(/\]\(mosaic-gradle-plugin\/README.md/, "](https://github.com/BuildMosaic/Mosaic/blob/" tag "/mosaic-gradle-plugin/README.md"); print}
          ' CHANGELOG.md >> "$notes"
          if existing_release="$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>&1)"; then
            echo "::error::A GitHub Release already exists for $RELEASE_TAG: $existing_release"
            exit 1
          elif [[ "$existing_release" == 'release not found' ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Mosaic $RELEASE_TAG" --notes-file "$notes"
          else
            echo "::error::Could not inspect GitHub Release for $RELEASE_TAG: $existing_release"
            exit 1
          fi
