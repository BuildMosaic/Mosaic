// check.sh prepends the requested plugins DSL, so installation uses real plugin markers.
def runtime = providers.gradleProperty('compat.runtime').get()
def analysis = providers.gradleProperty('compat.analysis').get()
repositories {
    if (System.getenv('MOSAIC_COMPAT_REPOSITORY')) maven { url = uri(System.getenv('MOSAIC_COMPAT_REPOSITORY')) }
    mavenCentral()
}
kotlin { jvmToolchain(17) }
dependencies {
    implementation(enforcedPlatform("org.buildmosaic:mosaic-bom:$runtime"))
    ['mosaic-core', 'mosaic-test', 'mosaic-opentelemetry'].each { implementation("org.buildmosaic:$it:$runtime") }
}
application { mainClass = 'certification.RuntimeConsumerKt' }
if (analysis != '-') {
    mosaicAnalysis {
        roots.add('certification.safe()')
        roots.add('certification.unknown()')
        if (providers.gradleProperty('compat.missing').isPresent()) roots.add('certification.missing()')
    }
    tasks.register('checkAnalysis') {
        dependsOn('mosaicGraph', 'jar')
        doLast {
            def summary = new groovy.json.JsonSlurper().parse(file('build/mosaic-analysis/main/summary.json'))
            assert summary.producer.compilerVersion == providers.gradleProperty('compat.kotlin').get()
            assert summary.producer.analysisVersion == analysis
            def graph = file('build/reports/mosaic-analysis/graph.md').text
            assert graph.contains('## Root: certification.safe()') && graph.contains('Status: VERIFIED')
            assert graph.contains('## Root: certification.unknown()') && graph.contains('Status: UNVERIFIED')
            def jar = tasks.jar.archiveFile.get().asFile
            new java.util.jar.JarFile(jar).withCloseable { archive ->
                assert archive.getJarEntry('META-INF/mosaic-analysis/v1/summary.json') != null
            }
        }
    }
    tasks.check { dependsOn('checkAnalysis') }
}
