import groovy.json.JsonOutput
import java.security.MessageDigest

// Dependency resolution only. No Kotlin Gradle plugin, Mosaic Gradle plugin, or TestKit.
plugins { id 'java' }

def runtime = providers.gradleProperty('compat.runtime').get()
def analysis = providers.gradleProperty('compat.analysis').getOrElse('')
def requested = providers.gradleProperty('compat.kotlin').get()
def baseline = providers.gradleProperty('compat.baseline').get()
def workspace = file(providers.gradleProperty('compat.workspace').get())
def evidence = new File(workspace, "$runtime/${analysis ?: 'runtime'}/$requested")
def required = analysis ? ['compiler', 'controlCompiler', 'consumer', 'extractor', 'runner'] : ['compiler', 'consumer']

repositories {
    maven {
        url = uri(new File(workspace, 'repository'))
        // Exercise published POM transitivity; candidates have unique versions.
        metadataSources { mavenPom(); artifact() }
    }
    mavenCentral()
}

required.each { name ->
    configurations.create(name) {
        canBeConsumed = false
        canBeResolved = true
        resolutionStrategy.failOnDynamicVersions()
        resolutionStrategy.failOnChangingVersions()
    }
}
configurations.consumer {
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
    }
}
if (analysis) configurations.extractor.transitive = false

dependencies {
    compiler('org.jetbrains.kotlin:kotlin-compiler-embeddable') { version { strictly requested } }
    ['mosaic-core', 'mosaic-test', 'mosaic-opentelemetry'].each {
        consumer("org.buildmosaic:$it:$runtime") { version { strictly runtime } }
    }
    if (analysis) {
        controlCompiler('org.jetbrains.kotlin:kotlin-compiler-embeddable') { version { strictly baseline } }
        extractor("org.buildmosaic:${providers.gradleProperty('compat.extractor').orElse('mosaic-compiler-plugin').get()}:$analysis") { version { strictly analysis } }
        runner 'org.junit.platform:junit-platform-console-standalone:1.12.2'
        runner "org.jetbrains.kotlin:kotlin-test-junit5:$baseline"
    }
}

tasks.register('resolveEvidence') {
    doLast {
        evidence.mkdirs()
        def result = [gradle: gradle.gradleVersion, java: System.getProperty('java.version'), configurations: [:]]
        def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }.get()
        result.java17 = launcher.executablePath.asFile.absolutePath
        result.java17Version = launcher.metadata.javaRuntimeVersion
        configurations.findAll { it.name in required }.each { config ->
            def artifacts = config.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
                def id = artifact.moduleVersion.id
                def hash = MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
                [coordinate: "$id.group:$id.name:$id.version", group: id.group, module: id.name,
                 version: id.version, file: artifact.file.absolutePath, sha256: hash]
            }.sort { it.coordinate }
            result.configurations[config.name] = [artifacts: artifacts]
        }
        new File(evidence, 'resolution.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(result)) + '\n'
    }
}
